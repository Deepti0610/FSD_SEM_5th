<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Management System</h1>
    <label for="studentName">Student Name:</label>
     <input type="text" id="studentName"><br>

    <label for="rollNo">Roll Number:</label>
     <input type="text" id="rollNo"><br>

    <label for="course">Course:</label>
     <select id="course">  
        <option value="Select Course">Select Course</option> 
        <option value="BCA">BCA</option>
        <option value="BBA">BBA</option>
        <option value="B.Tech">B.Tech</option>
        <option value="MCA">MCA</option>
        <option value="MBA">MBA</option>
    </select>
    <br>

    <label for="marks">Marks:</label>
     <input type="text" id="marks"><br>
     <button onclick="addStudent()">Add Student</button><br>
    <input type="text" id="searchInput" placeholder="Search by Name or Roll No.">
     <span id="totalStudents"></span><br>
    <table id="studentTable" border="1"><br>
        <thead>
            <tr>
                <th>Name</th>
                <th>Roll Number</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Actions</th>
                <button onclick="edit()">Edit</button>
                <button onclick="delete()">Delete</button>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- Student rows will be added here -->

        </tbody>


</body>
</html>
